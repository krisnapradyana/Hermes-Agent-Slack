provider: anthropic
model:
  default: claude-sonnet-4.6
  auxiliary: claude-haiku-4-5
  supports_vision: true

display:
  # Suppress mid-turn "thinking" step messages in Slack
  show_reasoning: false
  # Don't post intermediate assistant updates while processing
  interim_assistant_messages: false
  # Silence tool progress spam (off | new | all | verbose)
  tool_progress: "off"

gateway:
  # Only send the final result for background/cron jobs, not every step
  background_notifications: result

# ── MCP Servers ──────────────────────────────────────────────────────────────
mcp_servers:
  seedance:
    # Local BytePlus Ark MCP server (StreamableHTTP transport)
    url: http://seedance-mcp:8765/mcp
    connect_timeout: 30
    timeout: 900

# ── Skills Configuration ──────────────────────────────────────────────────────
skills:
  external_dirs:
    - /opt/data/custom-skills

# ── Google Drive Settings ────────────────────────────────────────────────────
google_drive:
  folder_id: "1-2hES89_Md5Mkhqo_a5EHRk-eJuNxlCT"  # Paste your Google Drive Folder ID here (from Google Drive URL) to upload videos directly into it

# ── Cleanup Settings ─────────────────────────────────────────────────────────
# Controls when temporary generated files (videos, documents, etc.) are removed.
cleanup:
  # Delete the temp file immediately after a successful upload/delivery
  on_success: true

  # Delete the temp file even when upload/delivery fails
  # Set to false to keep files for manual inspection/retry after failures
  on_failure: false

  # Run a sweep of stale temp files when the container starts up
  on_startup: true

  # Maximum age (in seconds) before a temp file is considered stale and eligible
  # for cleanup. Only applies to on_startup sweep. Default: 3600 (1 hour)
  max_age_seconds: 3600

  # Directory where temporary generated files are stored
  temp_dir: "/tmp"

  # Glob patterns of temp file names to target during cleanup sweeps
  temp_patterns:
    - "seedance_*.*"
    - "hermes_doc_*.tmp"
    - "hermes_gen_*"