services:
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-local-agent
    restart: unless-stopped
    ports:
      - "8642:8642"
    volumes:
      - ./config.yaml:/opt/data/custom-config.yaml
      - ./.env:/opt/data/custom-.env
      - ./env_sync.py:/opt/data/env_sync.py
      - ./skills:/opt/data/custom-skills
      - ./memory:/opt/data/memories
      - ./documents:/documents
      - ./soul/SOUL.md:/opt/soul/SOUL.md
    env_file:
      - .env
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 512m
    command: >
      sh -c "
        mkdir -p $$HOME/.hermes &&
        chmod -R 777 /opt/data/memories &&
        ln -sf /opt/soul/SOUL.md $$HOME/.hermes/SOUL.md &&
        ln -sf /documents/google_client_secret.json $$HOME/.hermes/google_client_secret.json &&
        ln -sf /documents/token.json $$HOME/.hermes/google_token.json &&
        ln -sf /opt/data/config.yaml $$HOME/.hermes/config.yaml &&
        mkdir -p /documents/user_tokens &&
        ln -sfn /documents/user_tokens $$HOME/.hermes/user_tokens &&

        /opt/hermes/.venv/bin/python3 /opt/data/env_sync.py &

        /opt/hermes/.venv/bin/python3 /opt/data/custom-skills/media/seedance/scripts/cleanup_temp_files.py &&
        hermes gateway run
      "
    depends_on:
      - seedance-mcp

  seedance-mcp:
    build: ./mcp-seedance
    container_name: seedance-mcp-server
    restart: unless-stopped
    environment:
      - ARK_API_KEY=${ARK_API_KEY}
      - MCP_PORT=8765
    ports:
      - "8765:8765"
    deploy:
      resources:
        limits:
          memory: 256m

  oauth-helper:
    build: ./oauth-helper
    container_name: hermes-oauth-helper
    restart: unless-stopped
    ports:
      - "8643:8643"
    volumes:
      - ./documents:/documents
    environment:
      - OAUTHLIB_INSECURE_TRANSPORT=1
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-hermes-oauth-secret-change-me}
      - OAUTH_PUBLIC_URL=${OAUTH_PUBLIC_URL:-http://localhost:8643}
    deploy:
      resources:
        limits:
          memory: 128m

