services:
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-local-agent
    restart: unless-stopped
    ports:
      - "8642:8642"
    volumes:
      - ./config.yaml:/opt/data/custom-config.yaml
      - ./.env:/opt/data/custom-.env
      - ./env_sync.py:/opt/data/env_sync.py
      - ./skills:/opt/data/custom-skills
      - ./memory:/opt/data/memories
      - ./documents:/documents
    env_file:
      - .env
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 512m
    command: sh -c "/opt/hermes/.venv/bin/python3 /opt/data/env_sync.py & hermes gateway run"
    depends_on:
      - seedance-mcp

  seedance-mcp:
    build: ./mcp-seedance
    container_name: seedance-mcp-server
    restart: unless-stopped
    environment:
      - ARK_API_KEY=${FAL_KEY}
      - MCP_PORT=8765
    ports:
      - "8765:8765"
    deploy:
      resources:
        limits:
          memory: 256m
